<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desbloquear</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
user-select:none;
-webkit-user-select:none;
}

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;

background:
radial-gradient(circle at center,#1b0000 0%,#090909 55%,#000 100%);
}

body::before{

content:"";
position:absolute;
width:120%;
height:120%;
background:
radial-gradient(circle,#ff000025 0%,transparent 60%);
animation:pulse 4s infinite;
filter:blur(80px);

}

@keyframes pulse{

50%{
transform:scale(1.2);
opacity:.6;
}

}

.container{

width:90%;
max-width:360px;
text-align:center;
z-index:10;

}

h2{

color:white;
font-weight:300;
margin-bottom:35px;
letter-spacing:2px;

}

.slider{

position:relative;
height:75px;
border-radius:60px;
overflow:hidden;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,.12);

box-shadow:
0 0 40px rgba(255,0,0,.18);

}

.fill{

position:absolute;
left:0;
top:0;
height:100%;
width:0;

background:linear-gradient(90deg,#7a0000,#ff1a1a);

transition:.08s;

}

.drag{

position:absolute;
width:72px;
height:72px;
border-radius:50%;
background:white;
left:4px;
top:3px;

display:flex;
align-items:center;
justify-content:center;

font-size:40px;

cursor:pointer;

box-shadow:
0 0 20px rgba(255,255,255,.4);

z-index:5;

}

.devil{

position:absolute;
right:18px;
top:50%;
transform:translateY(-50%);
font-size:34px;

filter:drop-shadow(0 0 12px red);

}

.success{

position:absolute;
inset:0;

display:flex;
align-items:center;
justify-content:center;

font-size:42px;
font-weight:bold;

color:white;

background:#b30000;

opacity:0;

transition:.3s;

}

</style>
</head>

<body>

<div class="container">

<h2>Arraste para desbloquear</h2>

<div class="slider" id="slider">

<div class="fill" id="fill"></div>

<div class="drag" id="drag">🤭</div>

<div class="devil">😈</div>

<div class="success" id="success">✔</div>

</div>

</div>

<script>

const drag=document.getElementById("drag");
const slider=document.getElementById("slider");
const fill=document.getElementById("fill");
const success=document.getElementById("success");

let down=false;
let startX=0;

const max=slider.offsetWidth-drag.offsetWidth-4;

drag.addEventListener("pointerdown",(e)=>{

down=true;
startX=e.clientX-drag.offsetLeft;

});

window.addEventListener("pointermove",(e)=>{

if(!down)return;

let x=e.clientX-startX;

if(x<4)x=4;
if(x>max)x=max;

drag.style.left=x+"px";

fill.style.width=(x+drag.offsetWidth/2)+"px";

if(x>=max){

down=false;

if(navigator.vibrate)
navigator.vibrate(120);

success.style.opacity=1;

setTimeout(() => {

    // Tenta abrir diretamente o aplicativo do Telegram
    window.location.href = "tg://resolve?domain=Clarinhaarc_bot";

    // Se não conseguir, abre a versão web após 1,2 s
    setTimeout(() => {
        window.location.href = "https://t.me/Clarinhaarc_bot";
    }, 1200);

}, 600);

}

});

window.addEventListener("pointerup",()=>{

if(!down)return;

down=false;

drag.style.transition=".25s";
fill.style.transition=".25s";

drag.style.left="4px";
fill.style.width="0px";

setTimeout(()=>{

drag.style.transition="";
fill.style.transition="";

},250);

});

</script>

</body>
</html>
